version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: latest
    container_name: wkblog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wkblog
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d wkblog"]
      interval: 10s
      timeout: 5s
      retries: 5

